# ---------------------------------------------------------------------------
# Gaps: in-scope rows of the standard this SDK does **not** implement.
#
# Listed rather than omitted, and that is the point. A row that is simply
# absent looks identical to a row nobody thought of, which is how ten of them
# went missing from the first version of this file — including an M3 row. A
# capability named here is one a reviewer can weigh; a capability missing from
# here is one they cannot.
#
# `canton-conformance` asserts that no test is named for a gap, so a gap cannot
# be quietly promoted to a claim, and that gaps + capabilities together account
# for every in-scope row of the standard.
# ---------------------------------------------------------------------------

[[gap]]
id        = "packages__json_package_mgmt"
name      = "JSON package mgmt"
section   = "Packages"
milestone = "M1"
reason    = "Package reads are implemented over gRPC only (`canton-admin`). The JSON Ledger API client covers version, ledger end, commands, ACS and updates; it has no package endpoint. Reaching packages over JSON is an M1 row this SDK does not deliver."
