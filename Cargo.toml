[workspace]
resolver = "2"
members  = ["crates/*"]

[workspace.package]
version      = "0.3.0"
edition      = "2024"
rust-version = "1.88"
license      = "Apache-2.0"
readme       = "README.md"
authors      = ["NODEJUMPER <dmitryk@nodejumper.io>"]
repository   = "https://github.com/nodejumper-org/canton-rust-sdk"
homepage     = "https://nodejumper.io/"
categories   = ["api-bindings", "asynchronous", "network-programming"]
keywords     = ["canton", "grpc", "ledger", "blockchain", "daml"]

[workspace.dependencies]
# internal crates (path = local build, version = published requirement)
canton-proto  = { path = "crates/canton-proto",  version = "0.3.0" }
canton-core   = { path = "crates/canton-core",   version = "0.3.0" }
canton-auth   = { path = "crates/canton-auth",   version = "0.3.0" }
canton-ledger = { path = "crates/canton-ledger", version = "0.3.0" }
canton-admin  = { path = "crates/canton-admin",  version = "0.3.0" }
canton-signer = { path = "crates/canton-signer", version = "0.3.0" }
canton-token  = { path = "crates/canton-token",  version = "0.3.0" }
canton-pqs    = { path = "crates/canton-pqs",    version = "0.3.0" }
canton        = { path = "crates/canton",        version = "0.3.0" }
canton-splice-api-token-metadata-v1 = { path = "crates/canton-splice-api-token-metadata-v1", version = "0.3.0" }
canton-splice-api-token-holding-v1 = { path = "crates/canton-splice-api-token-holding-v1", version = "0.3.0" }
canton-splice-api-token-transfer-instruction-v1 = { path = "crates/canton-splice-api-token-transfer-instruction-v1", version = "0.3.0" }
canton-splice-api-token-allocation-v1 = { path = "crates/canton-splice-api-token-allocation-v1", version = "0.3.0" }
canton-splice-api-token-allocation-instruction-v1 = { path = "crates/canton-splice-api-token-allocation-instruction-v1", version = "0.3.0" }
# M2 crates
canton-lf      = { path = "crates/canton-lf",      version = "0.3.0" }
canton-daml    = { path = "crates/canton-daml",    version = "0.3.0" }
canton-codegen = { path = "crates/canton-codegen", version = "0.3.0" }

# external
tonic        = { version = "0.14", default-features = false }
tonic-prost  = { version = "0.14" }
tonic-types  = { version = "0.14" }
prost        = { version = "0.14" }
sha2         = { version = "0.10", default-features = false }
ring         = { version = "0.17" }
base64       = { version = "0.22" }
# `runtime` (a default) carries the TLS plumbing `tokio-postgres-rustls`
# implements against, so it stays on.
tokio-postgres = { version = "0.7" }
tokio-postgres-rustls = { version = "0.13" }
prost-types  = { version = "0.14" }
tokio        = { version = "1", default-features = false }
tower        = { version = "0.5" }
thiserror    = { version = "2" }
tracing      = { version = "0.1" }
serde        = { version = "1", features = ["derive"] }
serde_json   = { version = "1" }
metrics      = { version = "0.24" }
futures-core = { version = "0.3" }
futures-util = { version = "0.3" }
tokio-stream = { version = "0.1" }
async-stream = { version = "0.3" }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
# WS-TLS connector construction (same rustls family tokio-tungstenite pins).
rustls              = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types    = { version = "1" }
rustls-native-certs = { version = "0.8" }
reqwest      = { version = "0.12", default-features = false }
uuid         = { version = "1", features = ["v4"] }
# build-deps
tonic-prost-build   = { version = "0.14" }
prost-build         = { version = "0.14" }
protoc-bin-vendored = { version = "3" }
walkdir             = { version = "2" }
# codegen (M2): Rust source emission + formatting + case conversion
proc-macro2  = { version = "1" }
quote        = { version = "1" }
syn          = { version = "2", features = ["full", "parsing"] }
prettyplease = { version = "0.2" }
semver       = { version = "1", default-features = false }
heck         = { version = "0.5" }
# Daml-LF archive reader (M2): DAR is a JAR-style zip of .dalf packages
zip          = { version = "2", default-features = false, features = ["deflate"] }
# generated-type JSON codec (M2): Timestamp/Date render as LF-JSON ISO strings
time         = { version = "0.3", default-features = false, features = ["formatting", "parsing", "std", "macros"] }

[workspace.lints.rust]
unsafe_code                   = "forbid"
missing_docs                  = "warn"
missing_debug_implementations = "warn"
unreachable_pub               = "warn"
rust_2018_idioms              = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic                = { level = "warn", priority = -1 }
unwrap_used             = "warn"
expect_used             = "warn"
module_name_repetitions = "allow"
missing_errors_doc      = "allow"
# Purely stylistic: flags proper/product names (LocalNet, Keycloak, OAuth2, …)
# in prose as "missing backticks". Too noisy for docs that name real systems.
doc_markdown            = "allow"
