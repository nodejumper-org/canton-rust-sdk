[package]
name         = "canton-conformance"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
authors      = { workspace = true }
repository   = { workspace = true }
homepage     = { workspace = true }
description  = "Conformance suite for the Canton Rust SDK, mapped 1:1 to the Ledger Client Standard. Not published."
publish      = false

[dependencies]

[dev-dependencies]
# The suite exercises the SDK the way an application does — through the facade,
# so a capability that is unreachable from `cargo add canton` does not count as
# delivered.
canton      = { workspace = true, features = ["ws", "otel", "pqs-tls"] }
canton-lf   = { workspace = true }
canton-proto = { workspace = true }
canton-splice-api-token-metadata-v1 = { path = "../canton-splice-api-token-metadata-v1" }
canton-codegen = { workspace = true }
canton-quickstart-licensing = { path = "../canton-quickstart-licensing" }
canton-splice-api-token-holding-v2 = { path = "../canton-splice-api-token-holding-v2" }
canton-splice-api-token-allocation-v2 = { path = "../canton-splice-api-token-allocation-v2" }
canton-splice-api-token-transfer-events-v2 = { path = "../canton-splice-api-token-transfer-events-v2" }
tokio       = { workspace = true, features = ["rt-multi-thread", "macros"] }
serde_json  = { workspace = true }

[lints]
workspace = true
