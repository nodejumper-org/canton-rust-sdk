[package]
name         = "canton-ledger"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
readme       = { workspace = true }
authors      = { workspace = true }
repository   = { workspace = true }
homepage     = { workspace = true }
categories   = { workspace = true }
keywords     = { workspace = true }
description  = "Async Canton Ledger API client (gRPC): commands, streaming, de-duplication, recovery."
include      = ["src/**/*", "examples/**/*", "README.md", "LICENSE"]

[dependencies]
canton-proto = { workspace = true }
canton-core  = { workspace = true }
canton-auth  = { workspace = true }
# `canton-signer` without its in-memory Ed25519 key. The library needs only the
# `Signer` trait and the wire types; `Ed25519Key` and `ring` come back with the
# `ed25519` feature, which the facade turns on by default. Taken with
# `default-features = false` because feature unification is additive: one
# dependant pinning the default would have forced `ring` on every HSM
# deployment in the tree, which is what it did.
canton-signer = { workspace = true }
tonic        = { workspace = true, features = ["transport", "codegen", "tls-ring", "tls-native-roots"] }
tonic-prost  = { workspace = true }
prost-types  = { workspace = true }
tokio        = { workspace = true, features = ["rt", "macros", "time"] }
tracing      = { workspace = true }
futures-core = { workspace = true }
tokio-stream = { workspace = true }
async-stream = { workspace = true }
uuid         = { workspace = true }
reqwest      = { workspace = true, features = ["json", "rustls-tls"] }
serde        = { workspace = true }
serde_json   = { workspace = true }
# `ws` feature: JSON transport streaming over WebSocket (+ TLS connector).
tokio-tungstenite   = { workspace = true, optional = true }
futures-util        = { workspace = true, optional = true }
rustls              = { workspace = true, optional = true }
rustls-pki-types    = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }

# `otel` feature: the WebSocket handshake carries W3C trace context, which needs
# a header map to inject into.
http = { version = "1", optional = true }

[features]
# The in-memory Ed25519 key, for callers who want one. An HSM/KMS caller
# turns this off and implements `Signer` themselves.
ed25519 = ["canton-signer/ed25519"]
# WebSocket streaming for the JSON transport (unbounded live tails).
ws = [
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:rustls",
    "dep:rustls-pki-types",
    "dep:rustls-native-certs",
]
# OpenTelemetry: OTLP span export + W3C trace-context propagation on outgoing
# requests (forwards to canton-core's `otel`).
otel = ["canton-core/otel", "dep:http"]

[dev-dependencies]
# The interactive tests sign with the in-memory key; dependants do not have to.
canton-signer = { workspace = true }
# The interactive-submission live test allocates an external party, which is
# an admin RPC. No cycle: canton-admin does not depend on this crate.
canton-admin = { workspace = true }

tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
# Server stubs (dev-only) so in-process gRPC test servers can be built.
canton-proto = { workspace = true, features = ["server"] }
tokio-stream = { workspace = true, features = ["net"] }
rcgen = "0.13"
# The trace-propagation test needs a real OpenTelemetry context to propagate:
# without a tracer installed there is no trace id, and the test would pass on a
# client that injects nothing.
tracing-subscriber    = "0.3"
tracing-opentelemetry = "0.28"
opentelemetry         = "0.27"
opentelemetry_sdk     = { version = "0.27", features = ["rt-tokio"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
