[package]
name         = "canton"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
readme       = { workspace = true }
authors      = { workspace = true }
repository   = { workspace = true }
homepage     = { workspace = true }
categories   = { workspace = true }
keywords     = { workspace = true }
description  = "The Canton Network Rust SDK: one-stop entry point re-exporting the canton-* crate family."
include      = ["src/**/*", "README.md", "LICENSE"]

[dependencies]
canton-core   = { workspace = true }
canton-auth   = { workspace = true }
canton-ledger = { workspace = true }
canton-admin  = { workspace = true }
canton-daml   = { workspace = true }
canton-signer = { workspace = true }
canton-token  = { workspace = true }
canton-pqs    = { workspace = true }

[features]
# Forwarded to the crates that implement them, so `canton = { features = [..] }`
# is the only place users have to think about.
# On by default, so `cargo add canton` is unchanged. An HSM/KMS deployment that
# must not link `ring` or the in-memory private-key type takes
# `default-features = false` — which did nothing at all before, because three
# crates in the tree pinned the signer's default and feature unification is
# additive.
default = ["ed25519"]
ed25519 = ["canton-signer/ed25519", "canton-ledger/ed25519", "canton-admin/ed25519"]
ws   = ["canton-ledger/ws"]
# Named on both, not only the ledger: `canton::telemetry::otel` is this crate's
# own re-export, and forwarding through canton-ledger alone left it correct by
# accident — one change to that crate's feature list and the facade's OTLP
# setup would vanish from the API without anything failing to compile.
otel = ["canton-ledger/otel", "canton-core/otel"]
# PQS over TLS. Forwarded because this crate's own conformance suite states the
# rule: "a capability that works only via a member crate is not one
# `cargo add canton` delivers". Without this, reaching a PQS behind TLS meant
# adding a second, separately-versioned `canton-pqs` dependency — the version
# skew the facade exists to prevent.
pqs-tls = ["canton-pqs/tls"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
# Same cfg every other crate in the family sets. Without it a `doc(cfg)` added
# here would silently not render — and the sibling crates show that the
# attribute arrives long after the manifest is written.
rustdoc-args = ["--cfg", "docsrs"]
