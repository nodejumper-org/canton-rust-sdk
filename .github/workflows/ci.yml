name: CI
on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      # --all-features so the ws / otel / server code paths are linted too.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Unit / in-process / TLS / ws tests need no node; live tests skip without
      # CANTON_TEST_ENDPOINT. --all-features covers the ws + otel surface.
      - run: cargo test --workspace --all-features

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0 # == workspace.package.rust-version
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  # Every feature combination must build & lint (default, ws, otel, server, …).
  feature-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
      - run: cargo hack clippy --workspace --feature-powerset --no-dev-deps -- -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with: { command: check all }

  # Manifest breakage (a bad `include`, a missing licence file, a path
  # dependency without a version) otherwise surfaces only at `cargo publish`,
  # when half the crates are already live and the order cannot be undone.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Every publishable crate packages cleanly
        run: |
          for crate in canton-proto canton-core canton-auth canton-lf canton-daml \
                       canton-ledger canton-admin canton-codegen canton-codegen-cli canton \
                       canton-splice-amulet canton-splice-wallet canton-splice-wallet-payments; do
            cargo package --no-verify --list -p "$crate" > /tmp/files.txt
            grep -qx 'LICENSE' /tmp/files.txt || { echo "::error::$crate ships no LICENSE"; exit 1; }
            grep -qx 'README.md' /tmp/files.txt || { echo "::error::$crate ships no README"; exit 1; }
            # Integration tests read fixtures from the repo root, which is not in
            # the package — shipping them gives a published crate a failing
            # `cargo test`.
            ! grep -q '^tests/' /tmp/files.txt || { echo "::error::$crate ships integration tests"; exit 1; }
          done

  # The four committed binding crates prove that *some* past generator emitted
  # compilable code. This proves the one on this commit does.
  codegen-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generate from the fixture DAR and compile the result
        run: |
          cargo run -p canton-codegen-cli -- \
            --dar testdata/splice-api-token-holding-v1-1.0.0.dar \
            --out "$RUNNER_TEMP/bindings" \
            --runtime-path "$GITHUB_WORKSPACE/crates/canton-daml"
          # No Cargo.lock is generated for the output crate, so --locked could
          # only ever fail here.
          cd "$RUNNER_TEMP/bindings" && cargo check

  # The native LF decoder claims to agree with the official JVM reader. That
  # claim is only worth what a reviewer can re-run, so run it here rather than
  # leaving it to a local machine. Its own job: it pulls a JVM and the Maven
  # artifact, which the fast gates should not wait on.
  lf-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: VirtusLab/scala-cli-setup@v1
      - name: Native decoder agrees with daml-lf-archive-reader
        env:
          CANTON_LF_ORACLE_DAR: testdata/splice-api-token-holding-v1-1.0.0.dar
        run: |
          # The test skips silently when the DAR or scala-cli is absent, which
          # here would mean a green job that verified nothing.
          cargo test -p canton-lf --test oracle -- --nocapture | tee /tmp/oracle.log
          grep -q 'oracle agreement:' /tmp/oracle.log || {
            echo "::error::the oracle skipped instead of running"; exit 1; }

  # NOTE (post-first-release): enable cargo-semver-checks once a baseline is on
  # crates.io — it guards the hand-written public API against accidental
  # breaking changes (generated proto types are exempt per the stability
  # policy in canton-proto).
  #
  # semver:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: obi1kenobi/cargo-semver-checks-action@v2
