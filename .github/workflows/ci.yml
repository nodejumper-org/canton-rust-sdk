name: CI
on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with: { toolchain: stable, components: rustfmt }
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with: { toolchain: stable, components: clippy }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # --all-features so the ws / otel / server code paths are linted too.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Unit / in-process / TLS / ws tests need no node; live tests skip without
      # CANTON_TEST_ENDPOINT. --all-features covers the ws + otel surface.
      - run: cargo test --workspace --all-features
      # ...and again with default features only. A test that names a
      # feature-gated item without gating itself compiles under --all-features
      # and breaks a plain `cargo test` — invisible to the line above. The
      # powerset clippy job does not run tests, so this is the only gate that
      # would catch it.
      - run: cargo test --workspace

  # The proposal's supported matrix is Tier-1 Rust on x86_64 and aarch64, plus
  # musl for static container binaries. The `test` job covers x86_64 Linux and
  # Windows and aarch64 macOS (which is what `macos-latest` now is); these are
  # the two claimed targets nothing was checking. `check` rather than `test`,
  # because running the binaries needs those machines — but a claim that the
  # SDK builds for a target is a claim CI can hold.
  cross-targets:
    name: The claimed targets still compile
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-unknown-linux-gnu, x86_64-unknown-linux-musl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with: { toolchain: stable, targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with: { key: "${{ matrix.target }}" }
      # The TLS stack compiles C for the target, so a cross toolchain is needed
      # even for `cargo check`.
      - run: sudo apt-get update && sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu
      - run: cargo check --workspace --all-features --target ${{ matrix.target }}
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        # == workspace.package.rust-version
        with: { toolchain: 1.88.0 }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # `rust-toolchain.toml` pins the channel for anything run inside the
      # checkout, and it wins over the toolchain the action just installed —
      # rustup says so in the log and then quietly uses stable. Without this the
      # job asks for 1.88, runs on stable, and the MSRV is never checked at all.
      # `RUSTUP_TOOLCHAIN` is the override that beats the file.
      - run: cargo check --workspace --all-features
        env:
          RUSTUP_TOOLCHAIN: 1.88.0

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  # What docs.rs will actually do, which the stable job above cannot see.
  # docs.rs builds on nightly with `--cfg docsrs`, and that cfg is what turns
  # on the `doc(cfg)` attributes — nightly-only ones that a crate must declare
  # `feature(doc_cfg)` to use. Without this job, a missing declaration is
  # invisible in CI and surfaces as a failed build on the published crate's
  # documentation page, where it cannot be fixed without a new release.
  docsrs:
    name: Documents the way docs.rs will build it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with: { toolchain: nightly }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo doc --workspace --no-deps --all-features
        env:
          # Same override as the MSRV job, and for the same reason: without it
          # this runs on stable, where `#![feature(doc_cfg)]` is a hard error
          # and the failure looks like the code's fault rather than the
          # toolchain's.
          RUSTUP_TOOLCHAIN: nightly
          RUSTDOCFLAGS: "--cfg docsrs -D warnings"

  # Every feature combination must build & lint (default, ws, otel, server, …).
  feature-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with: { toolchain: stable, components: clippy }
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with: { tool: cargo-hack }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo hack clippy --workspace --feature-powerset --no-dev-deps -- -D warnings

      # `--no-dev-deps` above means tests are never *compiled* under a feature
      # combination, let alone run — so a guard that only exists with a default
      # feature on looks covered while being absent exactly where it matters.
      # `canton-signer` is the case that made this concrete: its docs tell an
      # HSM/KMS caller to build with `default-features = false`, and the
      # signature-length check was written for that caller's failure mode (a
      # signing service returning a truncated reply). The check was inside
      # `#[cfg(feature = "ed25519")]`, so the one configuration it existed for
      # was the one configuration without it — and no job here would have said
      # so.
      - name: The crates a caller strips features from still pass their tests
        run: |
          set -euo pipefail
          cargo test -p canton-signer --no-default-features
          cargo test -p canton-pqs --no-default-features

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with: { command: check all }

  # Manifest breakage (a bad `include`, a missing licence file, a path
  # dependency without a version) otherwise surfaces only at `cargo publish`,
  # when half the crates are already live and the order cannot be undone.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Every publishable crate packages cleanly
        run: |
          set -euo pipefail
          # Derived, not listed. A hand-written list silently stops covering a
          # crate the moment one is added — and the first sign of that is a
          # failed `cargo publish` with half the release already live. Cargo
          # renders `publish = false` as an empty list.
          cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish != []) | .name' > /tmp/publishable.txt
          echo "checking: $(tr '\n' ' ' < /tmp/publishable.txt)"
          for crate in $(cat /tmp/publishable.txt); do
            cargo package --no-verify --list -p "$crate" > /tmp/files.txt
            grep -qx 'LICENSE' /tmp/files.txt || { echo "::error::$crate ships no LICENSE"; exit 1; }
            grep -qx 'README.md' /tmp/files.txt || { echo "::error::$crate ships no README"; exit 1; }
            # Integration tests read fixtures from the repo root, which is not in
            # the package — shipping them gives a published crate a failing
            # `cargo test`.
            ! grep -q '^tests/' /tmp/files.txt || { echo "::error::$crate ships integration tests"; exit 1; }
          done

  # The proposal asks for "a conformance suite mapped to the Ledger Client
  # Standard". A map is only worth something if it cannot quietly stop being
  # one, so this asserts the suite ran and covered every capability rather than
  # trusting a green tick.
  conformance:
    name: Conformance to the Ledger Client Standard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: The registry accounts for every in-scope row of the standard
        run: |
          set -euo pipefail
          # These guards are what make the count below mean anything: they
          # assert the registry covers the standard, that every claim has a
          # test, and that nothing claims a row recorded as a gap.
          cargo test -p canton-conformance --test completeness -- --nocapture \
            | tee /tmp/completeness.log

          # And this asserts they ran. `cargo test` exits 0 on "0 passed", so
          # deleting every guard in this file would have turned the step green
          # — the step that gates the count in the next one. Its sibling steps
          # already check their own markers; this one did not.
          guards=$(grep -oE 'test result: ok\. [0-9]+ passed' /tmp/completeness.log \
                   | grep -oE '[0-9]+')
          echo "completeness guards run: ${guards:-0}"
          [ "${guards:-0}" -ge 5 ] || {
            echo "::error::expected at least 5 completeness guards, ran ${guards:-0}"; exit 1; }

      - name: Every capability has a test, and every one of them ran
        run: |
          set -euo pipefail
          # Only the conformance binary. Summing every binary in the package
          # left slack equal to the number of guard tests, and an `#[ignore]`d
          # capability could hide in it.
          cargo test -p canton-conformance --test conformance -- --nocapture \
            | tee /tmp/conformance.log

          # Count `[[capability]]` blocks, not `id` lines: gaps carry an `id`
          # too, and counting those would inflate the threshold with rows this
          # SDK explicitly does *not* implement.
          capabilities=$(grep -c '^\[\[capability\]\]' conformance/capabilities.toml)
          result=$(grep -oE 'test result: ok\. [0-9]+ passed; [0-9]+ failed; [0-9]+ ignored' \
                   /tmp/conformance.log)
          ran=$(echo "$result" | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+')
          skipped=$(echo "$result" | grep -oE '[0-9]+ ignored' | grep -oE '[0-9]+')
          echo "capabilities claimed: $capabilities"
          echo "tests passed:         $ran (ignored: $skipped)"

          # Exact, not `>=`. A capability with two tests is fine in the suite
          # but would let a different one go missing under a `>=`.
          [ "$ran" -eq "$capabilities" ] || {
            echo "::error::the suite ran $ran tests for $capabilities capabilities"; exit 1; }
          # An ignored test still satisfies the name-based guard, since that
          # reads the suite's source. This is where it gets caught.
          [ "$skipped" -eq 0 ] || {
            echo "::error::$skipped conformance test(s) were ignored"; exit 1; }

      - name: The matrix says what CI actually checks
        run: |
          # The document is the published claim; a missing file means the claim
          # was deleted rather than revised.
          test -f docs/compatibility-matrix.md
          grep -q 'Ledger Client Standard' docs/compatibility-matrix.md

  # The committed binding crates prove that *some* past generator emitted
  # compilable code. This proves the one on this commit does.
  codegen-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Generate from the fixture DAR and compile the result
        run: |
          cargo run -p canton-codegen-cli -- \
            --dar testdata/splice-api-token-holding-v1-1.0.0.dar \
            --out "$RUNNER_TEMP/bindings" \
            --runtime-path "$GITHUB_WORKSPACE/crates/canton-daml"
          # No Cargo.lock is generated for the output crate, so --locked could
          # only ever fail here.
          cd "$RUNNER_TEMP/bindings" && cargo check
      - name: The generated crate compiles and round-trips against the runtime
        env:
          CODEGEN_COMPILE_TEST: "1"
        run: |
          # Gated on this variable because it spawns cargo, and nothing set it —
          # so the one test that proves generated code *compiles and runs*
          # skipped on every push, and went stale without anybody seeing it.
          cargo test -p canton-codegen --test compile -- --nocapture | tee /tmp/compile.log
          grep -qE 'test result: ok\. [1-9]' /tmp/compile.log || {
            echo "::error::the codegen compile test did not run"; exit 1; }

      - name: The emitter still produces the committed fixture
        run: |
          # The four drift guards over the published bindings crates need a DAR
          # from a Splice / cn-quickstart checkout, which this runner does not
          # have, so they skip — and a skipped test is a passing one. This fifth
          # guard uses the DAR in the repository and therefore actually runs;
          # assert that it did, the way the conformance-oracle job does.
          cargo test -p canton-codegen --test up_to_date -- --nocapture | tee /tmp/drift.log
          grep -q 'emitter fixture agreement: ok' /tmp/drift.log || {
            echo "::error::the emitter drift guard skipped instead of running"; exit 1; }

  # The native LF decoder claims to agree with the official JVM reader. That
  # claim is only worth what a reviewer can re-run, so run it here rather than
  # leaving it to a local machine. Its own job: it pulls a JVM and the Maven
  # artifact, which the fast gates should not wait on.
  lf-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: VirtusLab/scala-cli-setup@42e5f90b7aed2c0478e8074e5c25a030e1db3af6 # v1
      - name: Native decoder agrees with daml-lf-archive-reader
        env:
          CANTON_LF_ORACLE_DAR: testdata/splice-api-token-holding-v1-1.0.0.dar
        run: |
          # The test skips silently when the DAR or scala-cli is absent, which
          # here would mean a green job that verified nothing.
          cargo test -p canton-lf --test oracle -- --nocapture | tee /tmp/oracle.log
          grep -q 'oracle agreement:' /tmp/oracle.log || {
            echo "::error::the oracle skipped instead of running"; exit 1; }

  # The published bindings crates are checked-in generated code, and the
  # tests that keep them in step with the emitter are gated on a DAR that lives
  # in someone else's repository. Without one they skip — and a skipped test is
  # reported as a passing one, so on every push so far nothing had checked that
  # the emitter still produces what is on crates.io.
  #
  # cn-quickstart tracks those DARs in git, so they are fetched from a pinned
  # commit and checked against their SHA-256 rather than vendored: no repo
  # bloat, and the pin is what makes the run reproducible. Bumping the pin is a
  # deliberate edit that comes with new checksums.
  #
  # canton-quickstart-licensing is absent on purpose: its DAR is built from
  # source in cn-quickstart rather than committed, so there is nothing to pin.
  # That guard stays local-only.
  bindings-drift:
    name: Committed bindings match the emitter
    runs-on: ubuntu-latest
    env:
      QUICKSTART_COMMIT: 41f2d75cd16eff28aedfaf2e9a2278a881b1c71a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Fetch the DARs the committed crates were generated from
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dars"
          base="https://raw.githubusercontent.com/digital-asset/cn-quickstart/${QUICKSTART_COMMIT}/quickstart/daml/dars"
          cat > "$RUNNER_TEMP/dars/SHA256SUMS" <<'SUMS'
          48aaa72dfc992c6c89d5bfa84aece9fd9dad992e281252674fe33e203b2a391b  splice-amulet-0.1.14.dar
          f5897dbe3a8c6da1ce1b25f46ab739777a70c0ed0e4057d6336c77cab9a7d6fc  splice-wallet-0.1.14.dar
          e12ab52b325f488e87adcd4143058e16341c001bb77eb0adc0715bf5badee457  splice-wallet-payments-0.1.14.dar
          01df2e1b86e3a1b9ab55e97e42f280563c9d1fbe909963c74bef62dd642aa3ee  splice-api-featured-app-v1-1.0.0.dar
          e2607ca3a1d735a82d3066b78132aa8f94b1886c99a5f14148742d252c7220a2  splice-api-token-allocation-instruction-v1-1.0.0.dar
          5aed3f7e69a2c84b2be9d2033c07029fcde375d5041db264e58f44c8c7538303  splice-api-token-allocation-request-v1-1.0.0.dar
          c3f3b447142577ea4fa7d912ca11cd6821de7588e324e8877425932a02fccaa1  splice-api-token-allocation-v1-1.0.0.dar
          a18e85c4841a278bce000df8329c3f0e2fee3b30b55dd6a31492d10a72b4f9c1  splice-api-token-burn-mint-v1-1.0.0.dar
          ef75f8eb41a65810221784fdb78bb9dfac7cb22245aba14fa7cb7f69c34e0175  splice-api-token-holding-v1-1.0.0.dar
          455eb160cb5abd4ae9918a6fbb9dad471f721adda39f0e5c76feef08d05637fc  splice-api-token-metadata-v1-1.0.0.dar
          e4c73aa7ae73fb2fc330b938ffb99f568792321640ba4b9472902aa8d742c994  splice-api-token-transfer-instruction-v1-1.0.0.dar
          SUMS
          sed -i 's/^ *//' "$RUNNER_TEMP/dars/SHA256SUMS"
          cd "$RUNNER_TEMP/dars"
          while read -r _ name; do curl -fsSL -o "$name" "$base/$name"; done < SHA256SUMS
          # A DAR that is not the one the crate was generated from would make the
          # guard compare against the wrong thing and pass for the wrong reason.
          sha256sum -c SHA256SUMS
      - name: The emitter still produces the committed crates
        env:
          SPLICE_DARS: ${{ runner.temp }}/dars
        run: |
          set -euo pipefail
          cargo test -p canton-codegen --test up_to_date -- --nocapture | tee /tmp/drift.log
          # Assert each guard ran. Without this the job is green when the
          # directory is wrong or a crate quietly leaves the table — which is
          # the failure mode it exists to remove. The list is derived from the
          # crates that are actually in the tree, so adding one without adding
          # its DAR above fails here rather than passing unnoticed.
          # `canton-daml-stdlib` and the six `-v2` crates are generated from
          # packages committed here, so their guards run with no checkout at
          # all — but they are still named, because a guard that silently
          # stopped running is the failure this assertion exists to catch.
          for crate in $(ls -d crates/canton-splice-* | xargs -n1 basename) canton-daml-stdlib; do
            grep -q "bindings agreement: ${crate} ok" /tmp/drift.log || {
              echo "::error::the ${crate} drift guard did not run"; exit 1; }
          done
          # `canton-quickstart-licensing` is generated from a DAR that
          # cn-quickstart builds from source rather than commits, so there is
          # nothing to pin and nothing to fetch. That one guard stays local.
          ! grep -q 'skipping canton-splice' /tmp/drift.log || {
            echo "::error::a guard skipped despite its DAR being present"; exit 1; }

  # Guards the hand-written public API against a breaking change the version
  # number does not admit to. The baseline is whatever is on crates.io, so this
  # only became runnable once the first release was published — and a release
  # that *does* break API passes by carrying the version bump that says so
  # (pre-1.0, that is the minor).
  #
  # Generated proto types are exempt per the stability policy in canton-proto,
  # which is why `canton-proto` is excluded rather than the job being advisory.
  semver:
    name: Public API breaks carry a version bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          # The crates with a published baseline to compare against. A crate
          # cannot be checked before its first release, so each one joins this
          # list in the release after it first publishes — the M2 crates below
          # did so at 0.2.0. `canton-proto` stays out: its generated types are
          # exempt from the stability promise (ADR-0002), and `canton-codegen-cli`
          # is binary-only, so there is no API to compare.
          package: >-
            canton-core, canton-auth, canton-ledger, canton-admin, canton,
            canton-lf, canton-daml, canton-codegen,
            canton-splice-amulet, canton-splice-wallet, canton-splice-wallet-payments
          feature-group: all-features
